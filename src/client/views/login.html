<div id="loginPage" class="hidden-section min-h-screen lg:grid lg:grid-cols-2">
    <div class="relative min-h-[240px] lg:min-h-screen">
      <img
        src="/img/stock/e6b81516d953.jpg"
        alt="Cakrawala kota yang dipantau pusat komando"
        class="absolute inset-0 h-full w-full object-cover"
      >
      <div class="absolute inset-0 bg-gradient-to-t from-[#0b1d4a] via-brand-blue/75 to-brand-blue/35"></div>
      <div class="relative z-10 flex h-full flex-col justify-between p-6 text-white sm:p-10 lg:p-12">
        <button type="button" onclick="showPage('publicPortal')" class="inline-flex w-fit items-center gap-2 rounded-xl bg-white/10 px-3 py-2 text-sm font-medium backdrop-blur-md transition hover:bg-white/20">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke beranda
        </button>
        <div class="mt-10 lg:mt-0">
          <p class="text-sm font-medium text-orange-200">ARSY · Command center</p>
          <h2 class="mt-3 max-w-md text-3xl font-bold leading-tight sm:text-4xl">Setiap menit di jalan adalah keputusan.</h2>
          <p class="mt-4 max-w-md text-sm leading-relaxed text-white/80">Pantau gangguan, kecelakaan, ketertiban, dan kelancaran dari satu peta komando.</p>
        </div>
      </div>
    </div>
    <div class="flex items-center justify-center bg-white px-4 py-12 sm:px-8">
      <div class="w-full max-w-md">
        <div class="mb-8 flex items-center gap-3 lg:hidden">
          <span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-blue text-white"><i class="fa-solid fa-road"></i></span>
          <span class="text-sm font-semibold text-brand-blue">ARSY</span>
        </div>
        <h2 class="text-3xl font-bold text-slate-900">Selamat datang kembali</h2>
        <p class="mt-2 text-sm text-slate-500">Masuk dengan akun contoh di bawah. Sandi semua akun adalah <span class="font-semibold text-slate-700">arsy1234</span>.</p>
        <form id="loginForm" class="mt-8 space-y-5">
          <label class="block text-sm font-medium text-slate-700">
            Email
            <span class="relative mt-1.5 block">
              <i class="fa-solid fa-envelope pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input id="loginEmail" type="email" required autocomplete="username" placeholder="admin@arsy.id" class="w-full rounded-xl border border-slate-200 py-3 pl-11 pr-4 outline-none transition focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20">
            </span>
          </label>
          <label class="block text-sm font-medium text-slate-700">
            Kata sandi
            <span class="relative mt-1.5 block">
              <i class="fa-solid fa-lock pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input id="passwordInput" type="password" required autocomplete="current-password" placeholder="arsy1234" minlength="4" class="w-full rounded-xl border border-slate-200 py-3 pl-11 pr-12 outline-none transition focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20">
              <button type="button" id="togglePassword" class="absolute right-3 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-lg text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Tampilkan kata sandi">
                <i class="fa-solid fa-eye"></i>
              </button>
            </span>
          </label>
          <div class="flex items-center justify-between text-sm">
            <label class="inline-flex items-center gap-2 text-slate-600">
              <input type="checkbox" class="h-4 w-4 rounded accent-brand-orange" checked>
              Ingat sesi ini
            </label>
            <span class="font-medium text-brand-blue">Simulasi lokal</span>
          </div>
          <p id="loginError" class="hidden rounded-xl bg-red-50 px-3 py-2 text-sm text-red-700"></p>
          <button type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-brand-orange px-5 py-3 text-sm font-semibold text-white shadow-md transition hover:-translate-y-0.5 hover:shadow-lg">
            <i class="fa-solid fa-right-to-bracket"></i>
            Masuk ke dasbor
          </button>
        </form>
        <div class="mt-6">
          <p class="text-[11px] font-semibold uppercase tracking-[0.14em] text-slate-400">Akun contoh</p>
          <div class="mt-2 grid gap-2">
            <button type="button" data-demo="admin@arsy.id" class="flex items-center justify-between rounded-xl border border-slate-200 px-3 py-2 text-left text-sm hover:border-brand-blue hover:bg-slate-50"><span class="font-semibold text-slate-800">Admin</span><span class="text-xs text-slate-500">Semua menu · data nasional</span></button>
            <button type="button" data-demo="kapolri@arsy.id" class="flex items-center justify-between rounded-xl border border-slate-200 px-3 py-2 text-left text-sm hover:border-brand-blue hover:bg-slate-50"><span class="font-semibold text-slate-800">Kapolri</span><span class="text-xs text-slate-500">Eksekutif 1 · nasional</span></button>
            <button type="button" data-demo="kapolda.metro@arsy.id" class="flex items-center justify-between rounded-xl border border-slate-200 px-3 py-2 text-left text-sm hover:border-brand-blue hover:bg-slate-50"><span class="font-semibold text-slate-800">Kapolda Metro Jaya</span><span class="text-xs text-slate-500">Eksekutif 2 · provinsi</span></button>
            <button type="button" data-demo="kapolres.depok@arsy.id" class="flex items-center justify-between rounded-xl border border-slate-200 px-3 py-2 text-left text-sm hover:border-brand-blue hover:bg-slate-50"><span class="font-semibold text-slate-800">Kapolres Metro Depok</span><span class="text-xs text-slate-500">Eksekutif 3 · kota</span></button>
            <button type="button" data-demo="operator.depok@arsy.id" class="flex items-center justify-between rounded-xl border border-slate-200 px-3 py-2 text-left text-sm hover:border-brand-blue hover:bg-slate-50"><span class="font-semibold text-slate-800">Operator Depok</span><span class="text-xs text-slate-500">Petugas · kota Depok</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>
