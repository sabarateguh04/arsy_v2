<section id="viewMap" data-view class="absolute inset-0">
          <div id="map" class="absolute inset-0"></div>
          <p id="mapError" class="hidden-section absolute inset-x-4 top-4 z-20 rounded-lg bg-white px-4 py-3 text-sm text-slate-700 shadow-lg">Peta Google belum bisa dimuat. Periksa kunci API dan izin domain-nya.</p>
          <p id="mapHint" class="pointer-events-none absolute left-4 top-4 z-20 max-w-xs rounded-2xl bg-white/95 px-3 py-2 text-xs font-medium leading-relaxed text-slate-600 shadow ring-1 ring-slate-900/5">Garis biru adalah jalur kereta. Klik palang atau titik gangguan untuk rincian.</p>
          <aside id="pointPanel" role="dialog" aria-labelledby="pointTitle" class="hidden-section absolute inset-x-3 bottom-24 z-30 flex max-h-[58%] flex-col overflow-hidden rounded-2xl bg-white shadow-[0_16px_50px_rgba(15,23,42,0.18)] ring-1 ring-slate-900/5 md:inset-x-auto md:bottom-24 md:right-4 md:top-4 md:max-h-none md:w-[380px]">
            <button type="button" id="closePointPanel" class="absolute right-3 top-3 z-10 grid h-8 w-8 place-items-center rounded-full bg-white text-slate-700 shadow ring-1 ring-slate-200" aria-label="Tutup rincian">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="pointBody" class="min-h-0 flex-1 overflow-y-auto"></div>
          </aside>
          <div class="absolute bottom-5 left-1/2 z-20 flex max-w-[calc(100%-2rem)] -translate-x-1/2 items-center gap-1 rounded-full bg-white px-1.5 py-1.5 shadow-[0_8px_30px_rgba(15,23,42,0.12)] ring-1 ring-slate-900/5">
            <label class="cursor-pointer">
              <input id="layerAG" type="checkbox" checked class="peer sr-only">
              <span class="flex items-center gap-2 rounded-full px-3 py-1.5 text-[13px] text-slate-500 peer-checked:bg-slate-900 peer-checked:text-white">
                <span class="h-2 w-2 rounded-full bg-yellow-400"></span>
                AG <span id="countAG">0</span>
              </span>
            </label>
            <label class="cursor-pointer">
              <input id="layerPG" type="checkbox" checked class="peer sr-only">
              <span class="flex items-center gap-2 rounded-full px-3 py-1.5 text-[13px] text-slate-500 peer-checked:bg-slate-900 peer-checked:text-white">
                <span class="h-2 w-2 rounded-full bg-brand-orange"></span>
                PG <span id="countPG">0</span>
              </span>
            </label>
            <label class="cursor-pointer">
              <input id="layerGN" type="checkbox" checked class="peer sr-only">
              <span class="flex items-center gap-2 rounded-full px-3 py-1.5 text-[13px] text-slate-500 peer-checked:bg-slate-900 peer-checked:text-white">
                <span class="h-2 w-2 rounded-full bg-red-500"></span>
                GN <span id="countGN">0</span>
              </span>
            </label>
            <label class="cursor-pointer">
              <input id="layerKA" type="checkbox" checked class="peer sr-only">
              <span class="flex items-center gap-2 rounded-full px-3 py-1.5 text-[13px] text-slate-500 peer-checked:bg-slate-900 peer-checked:text-white">
                <span class="h-2 w-2 rounded-full bg-brand-blue"></span>
                KA <span id="countKA">0</span>
              </span>
            </label>
            <button type="button" id="recenterMap" class="rounded-full px-3 py-1.5 text-[13px] text-slate-500 hover:bg-slate-100 hover:text-slate-900">Pusat</button>
          </div>
        </section>
