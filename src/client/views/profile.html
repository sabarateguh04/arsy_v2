<section id="viewProfile" data-view class="absolute inset-0 hidden-section overflow-auto bg-[#f4f7fb] p-4 md:p-6">
          <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-[#f97316]">Akun</p>
          <h2 class="mt-1 text-2xl font-semibold text-[#0b1f4a]">Profil</h2>
          <div class="mt-5 grid max-w-5xl gap-4 lg:grid-cols-[17.5rem_minmax(0,1fr)]">
            <div class="rounded-3xl bg-[#0b1f4a] px-6 py-7 text-white shadow-sm">
              <span id="profileInitial" class="grid h-20 w-20 place-items-center rounded-3xl bg-[#f97316] text-2xl font-bold">DS</span>
              <p id="profileName" class="mt-5 text-xl font-semibold leading-snug">Dina Saputra</p>
              <p id="profileJabatan" class="mt-1 text-sm text-white/70">Admin</p>
              <p class="mt-5 inline-flex items-center gap-1.5 rounded-full bg-white/10 px-3 py-1 text-xs font-medium">
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
                <span id="profileRoleName">Admin</span>
              </p>
              <p id="profileStatus" class="mt-3 text-xs text-emerald-200">Aktif</p>
            </div>
            <div class="grid content-start gap-4">
              <div class="rounded-3xl border border-[#d7e3f4] bg-white p-5 shadow-sm">
                <p class="text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-400">Identitas</p>
                <dl class="mt-4 grid gap-4 sm:grid-cols-2">
                  <div>
                    <dt class="text-xs text-slate-500">ID pengguna</dt>
                    <dd id="profileId" class="mt-1 text-sm font-semibold text-[#0b1f4a]">USR-2401</dd>
                  </div>
                  <div>
                    <dt class="text-xs text-slate-500">Email</dt>
                    <dd id="profileEmail" class="mt-1 break-all text-sm font-semibold text-[#0b1f4a]">admin@arsy.id</dd>
                  </div>
                  <div>
                    <dt class="text-xs text-slate-500">Peran</dt>
                    <dd id="profileRoleDetail" class="mt-1 text-sm font-semibold text-[#0b1f4a]">Admin</dd>
                  </div>
                  <div>
                    <dt class="text-xs text-slate-500">Jabatan</dt>
                    <dd id="profileJabatanDetail" class="mt-1 text-sm font-semibold text-[#0b1f4a]">Admin</dd>
                  </div>
                </dl>
              </div>
              <div class="rounded-3xl border border-[#d7e3f4] bg-white p-5 shadow-sm">
                <p class="text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-400">Cakupan data</p>
                <dl class="mt-4 grid gap-4 sm:grid-cols-2">
                  <div>
                    <dt class="text-xs text-slate-500">Level</dt>
                    <dd id="profileLevel" class="mt-1 text-sm font-semibold text-[#0b1f4a]">Nasional</dd>
                  </div>
                  <div>
                    <dt class="text-xs text-slate-500">Wilayah</dt>
                    <dd id="profileArea" class="mt-1 text-sm font-semibold text-[#0b1f4a]">Nasional</dd>
                  </div>
                </dl>
                <p id="profileNote" class="mt-4 rounded-2xl bg-[#f4f7fb] px-4 py-3 text-sm leading-relaxed text-slate-600">Semua menu dan data nasional bisa dibuka.</p>
              </div>
            </div>
          </div>
        </section>
