<section id="viewPrimer" data-view class="absolute inset-0 hidden-section overflow-auto bg-slate-100 p-4 md:p-6">
          <p id="primerKicker" class="text-sm font-semibold text-brand-blue">Data Primer</p>
          <h2 id="primerTitle" class="mt-1 text-2xl font-semibold text-slate-900">Safety Driving Center</h2>
          <p id="primerLead" class="mt-1 max-w-2xl text-sm text-slate-500"></p>
          <div id="primerCrud" class="mt-6 hidden">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <p class="text-sm text-slate-500">Tambah, ubah, atau hapus baris. Perubahan berlaku sampai halaman dimuat ulang.</p>
              <button type="button" id="primerAdd" class="rounded-lg bg-brand-blue px-4 py-2 text-sm font-semibold text-white hover:bg-blue-900">Tambah</button>
            </div>
            <form id="primerForm" class="mt-3 hidden rounded-2xl border border-slate-200 bg-white p-4">
              <div id="primerFields" class="grid gap-3 sm:grid-cols-2"></div>
              <div class="mt-4 flex gap-2">
                <button type="submit" class="rounded-lg bg-brand-orange px-4 py-2 text-sm font-semibold text-white">Simpan</button>
                <button type="button" id="primerCancel" class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100">Batal</button>
              </div>
            </form>
          </div>
          <div id="primerStats" class="mt-6 grid gap-3 sm:grid-cols-3"></div>
          <div id="primerTable" class="mt-6 overflow-hidden rounded-2xl border border-slate-200 bg-white"></div>
        </section>
