<!-- News modal -->
  <div id="newsModal" class="hidden-section fixed inset-0 z-[80] flex items-end justify-center p-4 sm:items-center">
    <div class="absolute inset-0 bg-slate-900/50" data-close-news></div>
    <article class="relative max-h-[88vh] w-full max-w-xl overflow-auto rounded-3xl bg-white shadow-2xl">
      <img id="newsModalImage" alt="" class="h-56 w-full object-cover sm:h-64">
      <button type="button" data-close-news class="absolute right-3 top-3 grid h-9 w-9 place-items-center rounded-full bg-white/90 text-slate-600 shadow-md backdrop-blur hover:text-slate-900" aria-label="Tutup berita">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div class="p-6 sm:p-8">
        <p id="newsModalMeta" class="text-xs font-semibold uppercase tracking-wide text-brand-orange"></p>
        <h3 id="newsModalTitle" class="mt-2 text-2xl font-bold leading-snug text-slate-900"></h3>
        <p id="newsModalBody" class="mt-4 text-sm leading-relaxed text-slate-600"></p>
        <button type="button" data-close-news class="mt-6 inline-flex rounded-xl bg-brand-blue px-4 py-2.5 text-sm font-semibold text-white">Tutup</button>
      </div>
    </article>
  </div>
