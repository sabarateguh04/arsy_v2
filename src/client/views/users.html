<section id="viewUsers" data-view class="absolute inset-0 hidden-section overflow-auto p-4 md:p-6">
          <div class="mb-6 flex flex-col justify-between gap-3 sm:flex-row sm:items-end">
            <div>
              <p class="text-sm font-semibold text-brand-orange">Administrasi</p>
              <h2 class="text-2xl font-semibold text-slate-900">User Management</h2>
              <p class="mt-1 text-sm text-slate-500">Kelola akun operator. Data hidup di memori peramban.</p>
            </div>
            <button type="button" id="addUserBtn" class="inline-flex items-center justify-center gap-2 rounded-xl bg-brand-orange px-4 py-2.5 text-sm font-semibold text-white shadow-md transition hover:-translate-y-0.5 hover:shadow-lg">
              <i class="fa-solid fa-plus"></i> Tambah user
            </button>
          </div>
          <div class="overflow-hidden rounded-2xl border border-slate-100 bg-white shadow-sm">
            <div class="flex flex-col gap-3 border-b border-slate-100 p-4 sm:flex-row sm:items-center">
              <div class="relative min-w-0 flex-1">
                <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input id="userSearch" type="search" placeholder="Cari nama, email, peran, provinsi, atau kota" class="w-full rounded-xl border border-slate-200 py-2.5 pl-10 pr-4 text-sm outline-none transition focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/20">
              </div>
              <div class="relative">
                <button type="button" id="filterBtn" class="inline-flex items-center gap-2 rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
                  <i class="fa-solid fa-sliders"></i>
                  Filter
                  <span id="filterLabel" class="text-xs text-slate-400">Semua</span>
                </button>
                <div id="filterMenu" class="hidden-section absolute right-0 z-20 mt-2 w-44 rounded-xl border border-slate-100 bg-white p-1 shadow-xl">
                  <button type="button" data-status="Semua" class="block w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-50">Semua status</button>
                  <button type="button" data-status="Aktif" class="block w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-50">Aktif</button>
                  <button type="button" data-status="Nonaktif" class="block w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-slate-50">Nonaktif</button>
                </div>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table class="min-w-[920px] w-full text-left text-sm">
                <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
                  <tr>
                    <th class="px-4 py-3 font-semibold">Pengguna</th>
                    <th class="px-4 py-3 font-semibold">ID</th>
                    <th class="px-4 py-3 font-semibold">Peran</th>
                    <th class="px-4 py-3 font-semibold">Provinsi</th>
                    <th class="px-4 py-3 font-semibold">Kota</th>
                    <th class="px-4 py-3 font-semibold">Status</th>
                    <th class="px-4 py-3 font-semibold">Aksi</th>
                  </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
              </table>
            </div>
            <div class="flex items-center justify-between border-t border-slate-100 px-4 py-3 text-xs text-slate-500">
              <p id="userResultCount">0 pengguna</p>
              <p>Perubahan tersimpan sampai halaman dimuat ulang.</p>
            </div>
          </div>
        </section>
